<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Live chat" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <title>Live chat</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/force-refresh.js" defer></script>
  </head>
  <body class="chat-body">
    <div class="sand-waves" aria-hidden="true">
      <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <path d="M-80 160 C 120 120, 280 190, 480 155 S 860 100, 1080 155 S 1360 210, 1560 165" stroke-width="1.4" opacity="0.45"/>
        <path d="M-80 280 C 160 235, 340 315, 560 275 S 940 220, 1160 280 S 1430 340, 1560 295" stroke-width="1.3" opacity="0.35"/>
        <path d="M-80 420 C 170 375, 370 455, 600 415 S 980 360, 1200 420 S 1460 480, 1560 435" stroke-width="1.2" opacity="0.3"/>
        <path d="M-80 580 C 180 535, 400 615, 630 575 S 1020 520, 1240 580 S 1480 640, 1560 595" stroke-width="1.1" opacity="0.25"/>
      </svg>
    </div>

    <main class="chat-page">
      <header class="chat-page-header">
        <div>
          <p class="eyebrow">Live chat</p>
          <h1 id="chat-heading">Message us</h1>
        </div>
        <p class="muted" id="chat-status">Connecting…</p>
      </header>

      <p id="chat-error" class="error hidden"></p>

      <section id="chat-name-panel" class="chat-name-panel hidden">
        <p class="subtitle" style="margin:0 0 12px;">Enter your name to start messaging.</p>
        <form id="phone-chat-name-form" class="chat-name-form" autocomplete="off">
          <div class="field">
            <label for="phone-chat-name-input">Name</label>
            <input
              id="phone-chat-name-input"
              type="text"
              maxlength="80"
              required
              autocomplete="name"
              enterkeyhint="go"
              placeholder="Your name"
            />
          </div>
          <button class="btn btn-primary" type="submit">Continue</button>
        </form>
      </section>

      <div id="chat-messages" class="chat-messages hidden" aria-live="polite"></div>

      <form id="chat-form" class="chat-composer hidden" autocomplete="off">
        <input
          id="chat-input"
          type="text"
          maxlength="1000"
          required
          placeholder="Type a message…"
          enterkeyhint="send"
        />
        <button class="btn btn-primary btn-compact" type="submit" id="chat-send">Send</button>
      </form>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("id") || "";
      const messagesEl = document.getElementById("chat-messages");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const sendBtn = document.getElementById("chat-send");
      const statusEl = document.getElementById("chat-status");
      const errorEl = document.getElementById("chat-error");
      const namePanel = document.getElementById("chat-name-panel");
      const nameForm = document.getElementById("phone-chat-name-form");
      const nameInput = document.getElementById("phone-chat-name-input");
      const headingEl = document.getElementById("chat-heading");
      let lastKey = "";
      let closed = false;
      let visitorName = "";

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showNamedChat() {
        namePanel.classList.add("hidden");
        messagesEl.classList.remove("hidden");
        form.classList.toggle("hidden", closed);
        headingEl.textContent = visitorName ? `Hi, ${visitorName}` : "Message us";
      }

      function showNameGate() {
        namePanel.classList.remove("hidden");
        messagesEl.classList.add("hidden");
        form.classList.add("hidden");
        statusEl.textContent = "Name needed";
        setTimeout(() => nameInput.focus(), 50);
      }

      function renderMessages(messages) {
        const key = messages.map((m) => `${m.id}:${m.body}`).join("|");
        if (key === lastKey) return;
        lastKey = key;
        messagesEl.innerHTML = messages
          .map((m) => {
            const cls =
              m.sender === "visitor" ? "mine" :
              m.sender === "admin" ? "theirs" : "system";
            return `<div class="chat-bubble ${cls}">${escapeHtml(m.body)}</div>`;
          })
          .join("");
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function loadChat() {
        if (!sessionId) {
          errorEl.textContent = "Missing chat link. Scan the QR on the tablet again.";
          errorEl.classList.remove("hidden");
          statusEl.textContent = "Unavailable";
          namePanel.classList.add("hidden");
          form.classList.add("hidden");
          messagesEl.classList.add("hidden");
          return;
        }
        try {
          const res = await fetch(`/api/chat-session?id=${encodeURIComponent(sessionId)}`);
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not load chat");
          closed = data.session && data.session.status === "closed";
          visitorName = (data.session && data.session.visitorName) || "";
          statusEl.textContent = closed ? "Closed" : "Live";
          if (!visitorName) {
            showNameGate();
          } else {
            showNamedChat();
            renderMessages(data.messages || []);
          }
          errorEl.classList.add("hidden");
        } catch (err) {
          errorEl.textContent = err.message || "Could not load chat";
          errorEl.classList.remove("hidden");
        }
      }

      nameForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name || !sessionId) return;
        const btn = nameForm.querySelector("button[type='submit']");
        btn.disabled = true;
        try {
          const res = await fetch("/api/chat-session", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: sessionId, name }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not save name");
          visitorName = (data.session && data.session.visitorName) || name;
          await loadChat();
        } catch (err) {
          errorEl.textContent = err.message || "Could not save name";
          errorEl.classList.remove("hidden");
        } finally {
          btn.disabled = false;
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = input.value.trim();
        if (!body || closed || !visitorName) return;
        sendBtn.disabled = true;
        try {
          const res = await fetch("/api/chat-message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, sender: "visitor", body }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Could not send");
          input.value = "";
          await loadChat();
        } catch (err) {
          errorEl.textContent = err.message || "Could not send";
          errorEl.classList.remove("hidden");
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });

      fetch("/api/kiosk-status")
        .then((res) => res.json())
        .then((data) => {
          if (data && data.settings) applyTheme(data.settings.theme);
        })
        .catch(() => {});

      loadChat();
      setInterval(loadChat, 2500);
    </script>
  </body>
</html>
