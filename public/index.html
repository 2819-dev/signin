<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light only" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="screen">
      <!-- Closed -->
      <section id="closed-view" class="card center hidden">
        <div class="status-icon closed" aria-hidden="true">
          <svg class="closed-glyph" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M20 28V22a12 12 0 0 1 24 0v6"
              stroke="currentColor"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <rect
              x="14"
              y="28"
              width="36"
              height="28"
              rx="8"
              stroke="currentColor"
              stroke-width="4.5"
            />
            <circle cx="32" cy="40" r="3.5" fill="currentColor" />
            <path
              d="M32 43.5v5"
              stroke="currentColor"
              stroke-width="4.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h1 id="closed-title">Closed</h1>
        <p class="subtitle" id="closed-message">
          Not accepting visitors right now.
        </p>
      </section>

      <!-- Form -->
      <section id="form-view" class="card">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your name and why you want to come in.</p>
        <p id="form-error" class="error hidden"></p>
        <form id="signin-form" autocomplete="off">
          <div class="field">
            <label for="name">Your name</label>
            <input
              id="name"
              name="name"
              type="text"
              maxlength="100"
              required
              autocapitalize="words"
              autocomplete="off"
              enterkeyhint="next"
            />
          </div>
          <div class="field">
            <label for="reason">Why do you want to come in?</label>
            <textarea
              id="reason"
              name="reason"
              maxlength="500"
              required
              autocomplete="off"
            ></textarea>
          </div>
          <button class="btn btn-primary" type="submit" id="submit-btn">
            Request entry
          </button>
        </form>
      </section>

      <!-- Waiting -->
      <section id="waiting-view" class="card center hidden">
        <div class="status-icon waiting">
          <div class="spinner" aria-hidden="true"></div>
        </div>
        <h1>Waiting</h1>
        <p class="subtitle" id="waiting-text">
          Your request was sent. Please wait…
        </p>
      </section>

      <!-- Admitted -->
      <section id="admitted-view" class="card center hidden">
        <div class="status-icon ok" aria-hidden="true">✓</div>
        <h1>You may come in</h1>
        <p class="subtitle">You’re all set. Please enter.</p>
        <p class="muted" id="admitted-reset-hint">Starting over in 15 seconds…</p>
        <button class="btn btn-secondary" type="button" id="admitted-reset-btn" style="margin-top: 16px;">
          Start over
        </button>
      </section>

      <!-- Declined -->
      <section id="declined-view" class="card center hidden">
        <div class="status-icon no" aria-hidden="true">✕</div>
        <h1>Not admitted</h1>
        <p class="subtitle" id="decline-text"></p>
        <p class="muted" id="declined-reset-hint">Starting over in 15 seconds…</p>
        <button class="btn btn-secondary" type="button" id="reset-btn" style="margin-top: 16px;">
          Start over
        </button>
      </section>
    </main>

    <script>
      const closedView = document.getElementById("closed-view");
      const formView = document.getElementById("form-view");
      const waitingView = document.getElementById("waiting-view");
      const admittedView = document.getElementById("admitted-view");
      const declinedView = document.getElementById("declined-view");
      const form = document.getElementById("signin-form");
      const formError = document.getElementById("form-error");
      const submitBtn = document.getElementById("submit-btn");
      const declineText = document.getElementById("decline-text");
      const waitingText = document.getElementById("waiting-text");
      const resetBtn = document.getElementById("reset-btn");
      const admittedResetBtn = document.getElementById("admitted-reset-btn");
      const admittedResetHint = document.getElementById("admitted-reset-hint");
      const declinedResetHint = document.getElementById("declined-reset-hint");
      const closedTitleEl = document.getElementById("closed-title");
      const closedMessageEl = document.getElementById("closed-message");

      let pollTimer = null;
      let resetTimer = null;
      let countdownTimer = null;
      let kioskPollTimer = null;
      let currentRequestId = null;
      let isOpen = true;
      let activeView = "form";

      function show(view) {
        activeView = view === formView
          ? "form"
          : view === closedView
            ? "closed"
            : view === waitingView
              ? "waiting"
              : view === admittedView
                ? "admitted"
                : "declined";

        [closedView, formView, waitingView, admittedView, declinedView].forEach((el) => {
          el.classList.toggle("hidden", el !== view);
        });
      }

      function clearTimers() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        if (resetTimer) {
          clearTimeout(resetTimer);
          resetTimer = null;
        }
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
      }

      function applyClosedSign(settings) {
        closedTitleEl.textContent = settings.closedTitle || "Closed";
        closedMessageEl.textContent =
          settings.closedMessage || "Not accepting visitors right now.";
      }

      function goIdle() {
        clearTimers();
        currentRequestId = null;
        form.reset();
        formError.classList.add("hidden");
        submitBtn.disabled = false;
        if (isOpen) {
          show(formView);
        } else {
          show(closedView);
        }
      }

      function resetToForm() {
        goIdle();
      }

      function startAutoReset(hintEl) {
        let remaining = 15;
        const updateHint = () => {
          hintEl.textContent =
            remaining <= 1
              ? "Starting over…"
              : `Starting over in ${remaining} seconds…`;
        };
        updateHint();
        countdownTimer = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            return;
          }
          updateHint();
        }, 1000);
        resetTimer = setTimeout(resetToForm, 15000);
      }

      async function pollRequestStatus() {
        if (!currentRequestId) return;
        try {
          const res = await fetch(
            `/api/request-status?id=${encodeURIComponent(currentRequestId)}`
          );
          if (!res.ok) return;
          const data = await res.json();
          const req = data.request;
          if (!req) return;

          if (req.status === "admitted") {
            clearTimers();
            show(admittedView);
            startAutoReset(admittedResetHint);
          } else if (req.status === "declined") {
            clearTimers();
            declineText.textContent =
              req.declineReason || "Your request was declined.";
            show(declinedView);
            startAutoReset(declinedResetHint);
          }
        } catch (_) {
          // keep waiting; network may be temporarily unavailable
        }
      }

      async function pollKioskStatus() {
        try {
          const res = await fetch("/api/kiosk-status");
          if (!res.ok) return;
          const data = await res.json();
          const settings = data.settings || {};
          applyClosedSign(settings);

          const wasOpen = isOpen;
          isOpen = settings.isOpen !== false;

          // Don't interrupt an in-progress request decision flow.
          if (currentRequestId || activeView === "waiting" || activeView === "admitted" || activeView === "declined") {
            return;
          }

          if (!isOpen) {
            show(closedView);
          } else if (!wasOpen || activeView === "closed") {
            show(formView);
          }
        } catch (_) {}
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        formError.classList.add("hidden");
        submitBtn.disabled = true;

        const name = document.getElementById("name").value.trim();
        const reason = document.getElementById("reason").value.trim();

        try {
          const res = await fetch("/api/requests", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, reason }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            if (res.status === 403) {
              isOpen = false;
              applyClosedSign({
                closedTitle: closedTitleEl.textContent,
                closedMessage: data.error || closedMessageEl.textContent,
              });
              show(closedView);
              return;
            }
            throw new Error(data.error || "Could not send request");
          }

          currentRequestId = data.request.id;
          waitingText.textContent = `Thanks, ${data.request.name}. Please wait…`;
          show(waitingView);
          if (document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
          }
          pollTimer = setInterval(pollRequestStatus, 2000);
          pollRequestStatus();
        } catch (err) {
          formError.textContent = err.message || "Something went wrong";
          formError.classList.remove("hidden");
          submitBtn.disabled = false;
        }
      });

      resetBtn.addEventListener("click", resetToForm);
      admittedResetBtn.addEventListener("click", resetToForm);

      document.addEventListener("gesturestart", (e) => e.preventDefault());

      pollKioskStatus();
      kioskPollTimer = setInterval(pollKioskStatus, 4000);
    </script>
  </body>
</html>
