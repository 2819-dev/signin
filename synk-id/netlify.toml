[build]
  publish = "public"
  command = "node scripts/prepare.js"

[[redirects]]
  from = "/api/*"
  to = "https://visitor-signin-kiosk.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/act-as"
  to = "/act-as.html"
  status = 200

[[redirects]]
  from = "/act-as/*"
  to = "/act-as.html"
  status = 200

[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/settings"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/popular"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/submit"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/mod"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/mod-tools"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/search"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/groups"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/inbox"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/post/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/group/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/g/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/community/u/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/user/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/u/*"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/business"
  to = "/business.html"
  status = 200

[[redirects]]
  from = "/business/*"
  to = "/business.html"
  status = 200

[[redirects]]
  from = "/places"
  to = "/places.html"
  status = 200

[[redirects]]
  from = "/places/*"
  to = "/places.html"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/docs.html"
  status = 200

[[redirects]]
  from = "/testing"
  to = "/testing.html"
  status = 200

[[redirects]]
  from = "/testing/*"
  to = "/testing.html"
  status = 200

[[redirects]]
  from = "/info"
  to = "/info.html"
  status = 200

[[redirects]]
  from = "/info/*"
  to = "/info.html"
  status = 200

[[redirects]]
  from = "/documentation"
  to = "/docs"
  status = 302

[[redirects]]
  from = "/synk"
  to = "/verify"
  status = 302

[[redirects]]
  from = "/synk-join"
  to = "/join"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, max-age=0"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://visitor-signin-kiosk.netlify.app https://cdn.jsdelivr.net; font-src 'self' data:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Cache-Control = "no-cache, must-revalidate, max-age=0"
